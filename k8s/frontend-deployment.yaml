# Frontend Deployment
apiVersion: apps/v1
kind: Deployment

metadata:
  name: resume-ai-frontend
  labels:
    app: resume-ai-frontend

spec:
  # Run 2 frontend Pods
  replicas: 2

  selector:
    matchLabels:
      app: resume-ai-frontend

  template:
    metadata:
      labels:
        app: resume-ai-frontend

    spec:
      containers:
      - name: frontend

        # Frontend Docker image
        image: venugopalareddy/resume-ai-frontend:2.0

        # Nginx port
        ports:
        - containerPort: 80
        # CPU and memory settings
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"

          limits:
            cpu: "300m"
            memory: "256Mi"

        # Check if frontend is ready
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        # Check if frontend is alive
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
