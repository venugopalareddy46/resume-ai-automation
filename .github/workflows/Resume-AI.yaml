name: Resume AI CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/resume-ai-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/resume-ai-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ==========================================
  # JOB 1: Backend Test
  # ==========================================
  backend-test:
    name: Backend Test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Health endpoint syntax check
        run: |
          python -m compileall app


  # ==========================================
  # JOB 2: Frontend Build
  # ==========================================
  frontend-build:
    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: |
          npm run build


  # ==========================================
  # JOB 3: Docker Build & Push
  # ==========================================
  docker:
    name: Docker Build and Push

    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.venugopalareddy.in
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest


  # ==========================================
  # JOB 4: Kubernetes Deployment
  # ==========================================
  deploy:
    name: Deploy to Kubernetes

    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update backend image
        run: |
          kubectl set image deployment/resume-ai-backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Update frontend image
        run: |
          kubectl set image deployment/resume-ai-frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/resume-ai-backend \
            --timeout=180s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/resume-ai-frontend \
            --timeout=180s

      - name: Verify Kubernetes deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services