name: Resume AI CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

# ==========================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================
env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/resume-ai-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/resume-ai-frontend

  # Fixed application version
  IMAGE_TAG: "2.0"


jobs:

  # ==========================================
  # JOB 1: Backend Test
  # ==========================================
  backend-test:
    name: Backend Test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      # --------------------------------------
      # Checkout source code
      # --------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------
      # Setup Python
      # --------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------
      # Install dependencies
      # --------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------
      # Python syntax check
      # --------------------------------------
      - name: Health endpoint syntax check
        run: |
          python -m compileall app


  # ==========================================
  # JOB 2: Frontend Build
  # ==========================================
  frontend-build:
    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      # --------------------------------------
      # Checkout source code
      # --------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------
      # Setup Node.js
      # --------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --------------------------------------
      # Install dependencies
      # --------------------------------------
      - name: Install dependencies
        run: |
          npm ci

      # --------------------------------------
      # Build frontend
      # --------------------------------------
      - name: Build frontend
        run: |
          npm run build


  # ==========================================
  # JOB 3: Docker Build & Push
  # ==========================================
  docker:
    name: Docker Build and Push

    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:

      # --------------------------------------
      # Checkout source code
      # --------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------
      # Login to Docker Hub
      # --------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------
      # Setup Docker Buildx
      # --------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ======================================
      # BACKEND IMAGE
      # ======================================
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest

      # ======================================
      # FRONTEND IMAGE
      # ======================================
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true

          build-args: |
            VITE_API_BASE_URL=https://api.venugopalareddy.in

          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest


  # ==========================================
  # JOB 4: Kubernetes Deployment
  # ==========================================
  deploy:
    name: Deploy to Kubernetes

    # IMPORTANT:
    # This runner must be inside the AWS network
    # and must be able to reach:
    # 172.31.17.33:6443
    runs-on: self-hosted

    needs:
      - docker

    steps:

      # --------------------------------------
      # Checkout source code
      # --------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------
      # Configure kubeconfig
      # --------------------------------------
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

        run: |
          mkdir -p ~/.kube

          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config

          chmod 600 ~/.kube/config

      # --------------------------------------
      # Test Kubernetes connectivity
      # --------------------------------------
      - name: Check Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ======================================
      # UPDATE BACKEND
      # ======================================
      - name: Update backend image
        run: |
          kubectl set image deployment/resume-ai-backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # --------------------------------------
      # Force Kubernetes to check Docker Hub
      # --------------------------------------
      - name: Set backend image pull policy
        run: |
          kubectl patch deployment resume-ai-backend \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"backend","imagePullPolicy":"Always"}]}}}}'

      # ======================================
      # UPDATE FRONTEND
      # ======================================
      - name: Update frontend image
        run: |
          kubectl set image deployment/resume-ai-frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      # --------------------------------------
      # Force Kubernetes to check Docker Hub
      # --------------------------------------
      - name: Set frontend image pull policy
        run: |
          kubectl patch deployment resume-ai-frontend \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"frontend","imagePullPolicy":"Always"}]}}}}'

      # ======================================
      # BACKEND ROLLOUT
      # ======================================
      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/resume-ai-backend \
            --timeout=180s

      # ======================================
      # FRONTEND ROLLOUT
      # ======================================
      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/resume-ai-frontend \
            --timeout=180s

      # ======================================
      # VERIFY DEPLOYMENT
      # ======================================
      - name: Verify Kubernetes deployment
        run: |
          echo "======================================"
          echo "KUBERNETES DEPLOYMENTS"
          echo "======================================"

          kubectl get deployments

          echo ""
          echo "======================================"
          echo "KUBERNETES PODS"
          echo "======================================"

          kubectl get pods -o wide

          echo ""
          echo "======================================"
          echo "KUBERNETES SERVICES"
          echo "======================================"

          kubectl get services

      # ======================================
      # VERIFY BACKEND IMAGE
      # ======================================
      - name: Verify backend image
        run: |
          echo "Backend image:"
          kubectl get deployment resume-ai-backend \
            -o jsonpath='{.spec.template.spec.containers[*].image}'
          echo ""

      # ======================================
      # VERIFY FRONTEND IMAGE
      # ======================================
      - name: Verify frontend image
        run: |
          echo "Frontend image:"
          kubectl get deployment resume-ai-frontend \
            -o jsonpath='{.spec.template.spec.containers[*].image}'
          echo ""
